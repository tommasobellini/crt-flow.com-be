name: CRT Flow Intraday Scanner

on:
  schedule:
    # IC-CISD 15M/5M: ogni 15 min in sessione US (non ogni 5: Yahoo 429 sul free tier)
    # 13–21 UTC ≈ 9:30–16:00 ET + buffer, lun–ven. GitHub può slittare di qualche minuto.
    - cron: '2,17,32,47 13-21 * * 1-5'
    # DCA Screener: una volta al giorno alle 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Rimosso 'environment: PROD' per far leggere subito i Secrets di base
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Logic
        env:
          # Prende le chiavi dai Secrets standard di GitHub
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" == "0 1 * * *" ]; then
            echo "🚀 Running Daily DCA Screener..."
            if [ -f dca_screener.py ]; then
              python dca_screener.py
            else
              echo "⚠️  dca_screener.py non presente — skip"
            fi
          else
            echo "📊 Running IC-CISD Scanner (36 watchlist)..."
            python scanner.py
            python outcome_resolver.py
            if [ -f dca_notifier.py ]; then
              python dca_notifier.py
            else
              echo "⚠️  dca_notifier.py non presente — skip"
            fi
          fi