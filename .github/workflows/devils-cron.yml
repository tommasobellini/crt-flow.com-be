name: CRT Devil's Markers Scanner

on:
  schedule:
    # Just after the session-aligned 4H closes (America/New_York):
    #   bar A closes 13:30 ET -> 17:30 UTC (EDT) / 18:30 UTC (EST)
    #   bar B closes 16:00 ET -> 20:00 UTC (EDT) / 21:00 UTC (EST), also daily/weekly/monthly close
    # GitHub cron is UTC-only, so both DST candidates run (+10 min Yahoo buffer).
    # Off-season runs are harmless: market_data drops unclosed bars and upserts are idempotent.
    - cron: "40 17,18 * * 1-5"
    - cron: "10 20,21 * * 1-5"
  workflow_dispatch:

jobs:
  devils-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Devil's Markers scan + outcome resolve
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python devils_scanner.py --workers 10 --universe sp500_nasdaq
          python devils_outcome_resolver.py
          python devils_cisd_v1_paper.py  # PAPER ONLY, no orders
